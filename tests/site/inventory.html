<!doctype html><html><head><title>Practice Shop</title><script src="app.js"></script></head><body>
<script>requireLogin(); document.write(header());</script>
<span data-test="title">Products</span>
<div id="list"></div>
<script>
document.getElementById('list').innerHTML = PRODUCTS.map(p => `<div class="item">
  <a id="item_${p.id}_title_link" href="#" onclick="openItem(${p.id}); return false"><span data-test="inventory-item-name">${p.name}</span></a>
  <div data-test="inventory-item-price">$${p.price}</div>${addBtn(p)}</div>`).join('');
renderBadge();
// Like saucedemo (a React app): the URL changes first, the page redraws a moment later.
function openItem(id) {
  history.pushState({}, '', 'item.html?id=' + id);
  setTimeout(() => location.replace('item.html?id=' + id), 400);
}
</script></body></html>
